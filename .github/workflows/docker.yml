name: docker

# CI 虚拟机构建 Docker 镜像:
#   smoke — amd64 原生构建 + 容器实测(/health 必须通过;真实搜索尽力而为)
#   push  — 双架构(amd64+arm64)构建并推送 GHCR(ghcr.io/cshdotcom/guiless-bing-search)
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'guiless_bing_search.py'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (amd64)
        run: docker build -t gbs:test .

      - name: Start container
        run: |
          docker run -d --name gbs -p 8765:8765 gbs:test
          for i in $(seq 1 40); do
            if curl -sf -m 3 http://127.0.0.1:8765/health >/dev/null 2>&1; then
              echo "health OK after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container failed to become healthy"; docker logs gbs | tail -40; exit 1

      - name: Health endpoint content
        run: curl -sf http://127.0.0.1:8765/health

      - name: Search smoke test (multi-page aggregation, non-blocking)
        run: |
          set +e
          RES=$(curl -s -m 120 -X POST http://127.0.0.1:8765/search \
            -H 'Content-Type: application/json' \
            -d '{"query":"docker tutorial","count":15}')
          echo "$RES" | python3 -c "
          import json,sys
          try:
              r = json.load(sys.stdin)
              print('search returned %d results (>=10 means multi-page aggregation works)' % len(r))
              print('first:', r[0]['title'][:60] if r else '(empty)')
          except Exception as e:
              print('search response not parseable (network/IP dependent, NON-BLOCKING):', e)
          "
          echo '--- container log tail ---'
          docker logs gbs 2>&1 | grep -E 'Aggregating|Aggregation done|->|navigate' | tail -15

      - name: Cleanup
        if: always()
        run: docker rm -f gbs || true

  push:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
